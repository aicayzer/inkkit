<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 698" width="800" height="698" role="img" aria-labelledby="title desc">
  <title id="title">How InkKit keeps Markdown as written</title>
  <desc id="desc">An ordinary formatted Markdown editor rebuilds the whole file from its own model when it saves, which changes list markers, spacing and escaping you never touched. InkKit loads a Markdown file and edits it formatted with Milkdown. On save, a preservation layer returns a note you opened and left byte for byte unchanged. When you edit, unchanged blocks keep their original bytes and only edited blocks are written by Milkdown. InkKit then reads the result back. If it reopens as the same document, the file is saved. If not, the edit is refused and the note stays as it was. Your app owns the files, storage, toolbar and appearance.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 16px; font-weight: 600; }
    .s { font-size: 13.5px; }
    .l { font-size: 13.5px; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .h2 { font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="798.5" height="696.5" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="32" y="38" text-anchor="start" class="h" fill="#59636e">AN ORDINARY FORMATTED EDITOR</text>
  <rect x="32" y="50" width="200" height="56" rx="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/>
  <text x="132" y="73" text-anchor="middle" class="t" fill="#1f2328">Markdown file</text>
  <text x="132" y="93" text-anchor="middle" class="s" fill="#1f2328">Your note, as written</text>
  <path d="M 232 78 H 290" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <rect x="292" y="50" width="216" height="56" rx="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/>
  <text x="400" y="73" text-anchor="middle" class="t" fill="#1f2328">Rebuilds the whole file</text>
  <text x="400" y="93" text-anchor="middle" class="s" fill="#1f2328">from the editor's own model</text>
  <path d="M 508 78 H 566" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <rect x="568" y="50" width="200" height="56" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="668" y="73" text-anchor="middle" class="t" fill="#82071e">Saved file, changed</text>
  <text x="668" y="93" text-anchor="middle" class="s" fill="#82071e">markers, spacing, escaping</text>
  <line x1="32" y1="130" x2="768" y2="130" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="158" text-anchor="start" class="h" fill="#0969da">WITH INKKIT</text>
  <rect x="32" y="170" width="200" height="60" rx="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/>
  <text x="132" y="195" text-anchor="middle" class="t" fill="#1f2328">Markdown file</text>
  <text x="132" y="215" text-anchor="middle" class="s" fill="#1f2328">Your note, as written</text>
  <path d="M 232 200 H 290" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <rect x="292" y="170" width="216" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="195" text-anchor="middle" class="t" fill="#0a3069">InkKit loads it</text>
  <text x="400" y="215" text-anchor="middle" class="s" fill="#0a3069">Keeps the original bytes</text>
  <path d="M 508 200 H 566" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <rect x="568" y="170" width="200" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="668" y="195" text-anchor="middle" class="t" fill="#0a3069">Milkdown editing</text>
  <text x="668" y="215" text-anchor="middle" class="s" fill="#0a3069">You edit formatted text</text>
  <path d="M 668 230 V 276" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <text x="682" y="258" text-anchor="start" class="l" fill="#59636e">On save</text>
  <rect x="32" y="278" width="736" height="144" rx="14" fill="#eef6ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="52" y="306" text-anchor="start" class="h2" fill="#0a3069">Preservation layer</text>
  <text x="748" y="306" text-anchor="end" class="l" fill="#59636e">Nothing edited: saved byte for byte unchanged</text>
  <rect x="52" y="324" width="340" height="80" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="222" y="359" text-anchor="middle" class="t" fill="#0f5323">Unchanged blocks</text>
  <text x="222" y="379" text-anchor="middle" class="s" fill="#0f5323">Keep their original bytes</text>
  <rect x="408" y="324" width="340" height="80" rx="10" fill="#ffffff" stroke="#818b98" stroke-width="1.5"/>
  <text x="578" y="359" text-anchor="middle" class="t" fill="#1f2328">Edited blocks</text>
  <text x="578" y="379" text-anchor="middle" class="s" fill="#1f2328">Written by Milkdown</text>
  <path d="M 400 422 V 450" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <rect x="210" y="452" width="380" height="64" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="400" y="479" text-anchor="middle" class="t" fill="#0a3069">Read-back check</text>
  <text x="400" y="499" text-anchor="middle" class="s" fill="#0a3069">Does the result reopen as the same document?</text>
  <path d="M 300 516 V 548 H 217 V 568" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <path d="M 500 516 V 548 H 583 V 568" fill="none" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/>
  <text x="258" y="540" text-anchor="middle" class="l" fill="#59636e">Yes</text>
  <text x="541" y="540" text-anchor="middle" class="l" fill="#59636e">No</text>
  <rect x="52" y="570" width="330" height="58" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="217" y="594" text-anchor="middle" class="t" fill="#0f5323">Saved file</text>
  <text x="217" y="614" text-anchor="middle" class="s" fill="#0f5323">Your edits, and nothing else changed</text>
  <rect x="418" y="570" width="330" height="58" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="583" y="594" text-anchor="middle" class="t" fill="#4d2d00">Edit refused</text>
  <text x="583" y="614" text-anchor="middle" class="s" fill="#4d2d00">The note stays as it was</text>
  <line x1="32" y1="648" x2="768" y2="648" stroke="#d0d7de" stroke-width="1"/>
  <text x="400" y="674" text-anchor="middle" class="l" fill="#59636e">Your app owns the files, storage, toolbar and appearance.</text>
</svg>
