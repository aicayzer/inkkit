<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
<title id="title">How Inkkit preserves your Markdown</title><desc id="desc">Untouched blocks keep their source. Edited blocks are written again. Inkkit checks that the result reads correctly before accepting the edit; otherwise the original document stays unchanged.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#ddd;font-size:15px}.detail{fill:#999;font-size:13px}.box{fill:none;stroke:#555;stroke-width:1.2}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#555"/></marker></defs>
<rect class="box" x="30" y="16" width="310" height="72" rx="8"/><text x="185" y="45" text-anchor="middle" font-weight="600">Untouched blocks</text><text class="detail" x="185" y="66" text-anchor="middle">Keep the original source</text>
<rect class="box" x="380" y="16" width="310" height="72" rx="8"/><text x="535" y="45" text-anchor="middle" font-weight="600">Edited blocks</text><text class="detail" x="535" y="66" text-anchor="middle">Write only what needs to change</text>
<path d="M185 88v27h350V88 M360 115v28" fill="none" stroke="#555" marker-end="url(#arrow)"/>
<rect class="box" x="180" y="147" width="360" height="66" rx="8"/><text x="360" y="174" text-anchor="middle" font-weight="600">Read the result back</text><text class="detail" x="360" y="195" text-anchor="middle">Does it still match the edited document?</text>
<path d="M280 213v28H185v17 M440 213v28h95v17" fill="none" stroke="#555" marker-end="url(#arrow)"/>
<text x="185" y="281" text-anchor="middle" font-weight="600">Yes: accept the edit</text><text x="535" y="281" text-anchor="middle" font-weight="600">No: keep the original</text>
</svg>
