name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Full history includes main and any explicit maintenance release branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag names the package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version){console.error('::error::Tag '+process.env.GITHUB_REF_NAME+' does not match package.json version '+p.version);process.exit(1)}"
      - name: Check the release source
        run: node scripts/check-release-source.mjs

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    # The environment accepts only v* tags; the tag ruleset limits who can
    # create them. Every publication also requires source validation and CI.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-candidate
          path: release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      - name: Publish through npm trusted publishing
        run: |
          node --version
          npm --version
          version="${GITHUB_REF_NAME#v}"
          npm publish "./release/$version/aicayzer-inkkit-$version.tgz" --access public --provenance
