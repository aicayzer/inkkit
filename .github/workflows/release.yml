name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Full history includes main and any explicit maintenance release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag names the package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version){console.error('::error::Tag '+process.env.GITHUB_REF_NAME+' does not match package.json version '+p.version);process.exit(1)}"
      - name: Check the release source
        run: node scripts/check-release-source.mjs

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    # The environment accepts only v* tags; the tag ruleset limits who can
    # create them. Every publication also requires source validation and CI,
    # which includes the browser jobs and the Swift package tests.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-candidate
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Publish through npm trusted publishing
        run: |
          node --version
          npm --version
          version="${GITHUB_REF_NAME#v}"
          npm publish "./release/$version/aicayzer-inkkit-$version.tgz" --access public --provenance
