name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the main branch is available for the ancestry check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag names the package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version){console.error('::error::Tag '+process.env.GITHUB_REF_NAME+' does not match package.json version '+p.version);process.exit(1)}"
      - name: Check the tagged commit is on main
        run: |
          commit=$(git rev-parse "$GITHUB_REF^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tagged commit $commit is not on main"
            exit 1
          fi

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-candidate
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Publish through npm trusted publishing
        run: |
          node --version
          npm --version
          version="${GITHUB_REF_NAME#v}"
          npm publish "./release/$version/aicayzer-inkkit-$version.tgz" --access public --provenance
