name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the tagged commit.
  workflow_call:
permissions:
  contents: read
# A new push to a pull request supersedes its running checks. The group never
# uses github.workflow, which a calling workflow would share.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      editor: ${{ steps.scope.outputs.editor }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  check:
    needs: [changes, docs]
    # A failed classifier must fail this required check, not silently skip it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ needs.changes.result != 'success' || needs.docs.result == 'failure' || needs.docs.result == 'cancelled' }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - if: ${{ needs.changes.outputs.editor != 'true' }}
        run: npx --yes prettier@3.9.9 --check .
      - run: npm install --global pnpm@11.0.9
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm format:check
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: node --test scripts/ci-scope.test.mjs scripts/install-browsers.test.mjs
        if: ${{ needs.changes.outputs.editor == 'true' }}
      # The packed-consumer test opens its pages in both engines on main and
      # releases. Pull requests use Chromium only, like the browser shards, and
      # skip the system packages whose mirror stalls.
      - run: node scripts/install-browsers.mjs ${{ github.event_name == 'pull_request' && '--no-deps chromium' || 'chromium webkit' }}
        timeout-minutes: 17
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm check
        env:
          INKKIT_PACKAGE_ENGINES: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,webkit' }}
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm build:playground
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm test:built-playground
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.changes.outputs.editor == 'true' }}
        with:
          name: package-candidate
          path: _local/release/

  # The suite takes 15 to 25 minutes serially, so each engine runs in three
  # shards. The aggregating jobs keep the check names that branch protection
  # uses; the engines have separate shard jobs so one cannot fail the other.
  browser-chromium:
    needs: changes
    # A skipped shard job reports success through its aggregator below.
    if: ${{ needs.changes.outputs.editor == 'true' }}
    name: browser shard (chromium ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      # The Ubuntu image already has Chromium's libraries; skipping apt avoids a mirror that stalls.
      - run: node scripts/install-browsers.mjs --no-deps chromium
        timeout-minutes: 17
      - run: node --test scripts/test-browser.test.mjs
      - run: node scripts/test-browser.mjs --project=chromium --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-chromium-${{ matrix.shard }}
          path: _local/playwright/

  # Every current host embeds WebKit on Apple platforms. Pull requests run
  # Chromium only: macOS runners are scarce, so three WebKit shards per pull
  # request queue behind each other, and WebKit has not failed alone in CI
  # history. Pushes to main and release tags run it, and changes to selection,
  # input, clipboard or layout run WebKit specs on atlas before pushing.
  browser-webkit:
    needs: changes
    # A skipped shard job reports success through its aggregator below.
    if: ${{ needs.changes.outputs.editor == 'true' && github.event_name != 'pull_request' }}
    name: browser shard (webkit ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browsers.mjs webkit
        timeout-minutes: 17
      - run: node --test scripts/test-browser.test.mjs
      - run: node scripts/test-browser.mjs --project=webkit --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-webkit-${{ matrix.shard }}
          path: _local/playwright/

  browser-chromium-result:
    needs: [changes, browser-chromium]
    name: browser (chromium)
    # A failed or cancelled shard must fail this check, and a documentation-only
    # change, which skips the shards, must pass it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes: $CHANGES, shards: $SHARDS, editor: $EDITOR"
          test "$CHANGES" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$EDITOR" != true; }
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.browser-chromium.result }}
          EDITOR: ${{ needs.changes.outputs.editor }}

  browser-webkit-result:
    needs: [changes, browser-webkit]
    name: browser (webkit)
    # A failed or cancelled shard must fail this check, and a documentation-only
    # change, which skips the shards, must pass it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes: $CHANGES, shards: $SHARDS, editor: $EDITOR"
          test "$CHANGES" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && { test "$EDITOR" != true || test "$EVENT" = pull_request; }; }
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.browser-webkit.result }}
          EDITOR: ${{ needs.changes.outputs.editor }}
          EVENT: ${{ github.event_name }}

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npx --yes mint@4.2.1125 validate
        working-directory: docs
