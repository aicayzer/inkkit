name: CI
on:
  # Pushes to main are not run: pull requests must be up to date before they
  # merge, so the merged tree is the tree that passed.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The release workflow runs these same checks on the tagged commit.
  workflow_call:
permissions:
  contents: read
# A new push to a pull request supersedes its running checks. The group never
# uses github.workflow, which a calling workflow would share.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      editor: ${{ steps.scope.outputs.editor }}
      site: ${{ steps.scope.outputs.site }}
      swift: ${{ steps.scope.outputs.swift }}
      # Browser lanes are slow, so a draft pull request skips them. Marking it
      # ready starts a new run that includes them.
      browser: ${{ steps.scope.outputs.editor == 'true' && github.event.pull_request.draft != true }}
      playground: ${{ steps.scope.outputs.playground == 'true' && github.event.pull_request.draft != true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # Formatting, type checking, the package build and its consumer tests.
  check:
    needs: changes
    # A failed classifier must fail this check, not silently skip it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - if: ${{ needs.changes.outputs.editor != 'true' }}
        run: npx --yes prettier@3.9.9 --check .
      - run: npm install --global pnpm@11.0.9
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm format:check
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: node --test scripts/ci-scope.test.mjs scripts/install-browsers.test.mjs scripts/test-browser.test.mjs scripts/interop/verify-native.test.mjs
        if: ${{ needs.changes.outputs.editor == 'true' }}
      # The packed-consumer test opens its pages in both engines on releases.
      # Pull requests use Chromium here, since the browser shards run WebKit,
      # and skip the system packages whose mirror stalls.
      - run: node scripts/install-browsers.mjs ${{ github.event_name == 'pull_request' && '--no-deps chromium' || 'chromium webkit' }}
        timeout-minutes: 17
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm typecheck
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm build
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm test:docs
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm test:package
        env:
          INKKIT_PACKAGE_ENGINES: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,webkit' }}
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm build:playground
        if: ${{ needs.changes.outputs.editor == 'true' }}
      - run: pnpm test:built-playground
        if: ${{ needs.changes.outputs.editor == 'true' }}
      # The release workflow publishes this package, so only runs that can
      # release keep it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.changes.outputs.editor == 'true' && github.event_name != 'pull_request' }}
        with:
          name: package-candidate
          path: _local/release/
          retention-days: 7

  # The slowest suites are the preservation ones. The shards deal files out in
  # name order (test/shard-sequencer.ts) so those suites land in different jobs.
  unit:
    needs: changes
    if: ${{ needs.changes.outputs.editor == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}

  # Both engines run on every pull request that changes the editor: each host
  # app ships on WebKit. Each engine has three shard jobs so one cannot fail the
  # other. A skipped matrix job shows under its plain id, without a shard.
  browser-chromium:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      # The Ubuntu image already has Chromium's libraries; skipping apt avoids a mirror that stalls.
      - run: node scripts/install-browsers.mjs --no-deps chromium
        timeout-minutes: 17
      - run: node scripts/test-browser.mjs --project=chromium --shard=${{ matrix.shard }}
        env:
          INKKIT_BROWSER_FIXTURE: built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-chromium-${{ strategy.job-index }}
          path: _local/playwright/
          retention-days: 7

  browser-webkit:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browsers.mjs webkit
        timeout-minutes: 17
      - run: node scripts/test-browser.mjs --project=webkit --shard=${{ matrix.shard }}
        env:
          INKKIT_BROWSER_FIXTURE: built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-webkit-${{ strategy.job-index }}
          path: _local/playwright/
          retention-days: 7

  # The playground and docs demo specs: they run when playground, demo or
  # preset files change, not with the engine suite.
  browser-playground:
    needs: changes
    if: ${{ needs.changes.outputs.playground == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browsers.mjs --no-deps chromium
        timeout-minutes: 17
      - run: node scripts/test-browser.mjs --config playwright.playground.config.ts --project=chromium
        env:
          INKKIT_BROWSER_FIXTURE: built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-playground
          path: _local/playwright/
          retention-days: 7

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npx --yes mint@4.2.1125 validate
        working-directory: docs

  # Tests the InkKitRTF Swift package. A change that does not touch the package,
  # its fixtures or this workflow skips the job. Tags run it, and the release
  # workflow calls this workflow, so a failure here also blocks publication.
  swift:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    # GitHub-hosted macOS 27 image: actions/runner-images issue 14404.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -E '^Xcode 27([.]|$)'
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          swift --version
      - run: swift test --parallel

  # The one result to require. A lane that the scope or a draft skipped counts
  # as a pass; a failed, cancelled or unclassified run does not.
  ci-result:
    name: CI result
    needs:
      [
        changes,
        check,
        unit,
        browser-chromium,
        browser-webkit,
        browser-playground,
        docs,
        swift,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          test "$(echo "$NEEDS" | jq -r '.changes.result')" = success
          test -z "$(echo "$NEEDS" | jq -r '.[] | select(.result != "success" and .result != "skipped") | .result')"
        env:
          NEEDS: ${{ toJSON(needs) }}
